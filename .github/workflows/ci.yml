name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only ever read the checkout; nothing here writes to the repo,
# publishes a package or comments on a PR.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static gate runs once, on Linux: ruff, mypy, bandit and the
  # dependency audit answer the same on every OS, so paying for them on
  # three would buy nothing. Both interpreter versions, because a type or
  # lint result can turn on the running Python.
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check rl_cli/ tests/

      - name: Format check
        run: ruff format --check rl_cli/ tests/

      # tests/ is checked too: the suite is what asserts the package's
      # behaviour, so a test calling a service with the wrong argument type
      # is the same defect as the service having it.
      - name: Type check
        run: mypy rl_cli/ tests/

      - name: Security scan
        run: bandit -r rl_cli/ -q

      - name: Dependency audit
        run: pip-audit --skip-editable

  # The suite runs on all three OSes and both interpreter versions.
  # fail-fast is off so a Windows failure does not cancel the Linux and
  # macOS answers, and vice versa.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # The 100% coverage floor in pyproject's addopts is a POSIX claim:
      # rl_cli.storage.files keeps its 0600, umask-proof, no-symlink write
      # on POSIX and degrades to the platform default on Windows, where
      # O_NOFOLLOW and fchmod do not exist -- so the tests that assert those
      # guarantees are marked `posix_only` and skipped off POSIX, which
      # leaves a few branches unreachable there. The floor is therefore
      # enforced on Linux and macOS, where every branch runs, and dropped on
      # Windows, where the suite still has to pass, coverage aside.
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pytest -q -o addopts="--strict-markers"
          else
            pytest -q
          fi
